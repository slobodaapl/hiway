[package]
name = "hiway-tests"
version = "0.0.0"
edition = "2021"
rust-version = "1.96.1"
publish = false

[features]
default = []
std = ["hiway/std"]

[dependencies]
hiway = { path = "..", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[[test]]
name = "public_api"
path = "tests_api.rs"
required-features = ["std"]

[[test]]
name = "no_std"
path = "tests_no_std.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
