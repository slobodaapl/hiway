[package]
name = "hiway-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
description = "Attribute macros for hiway event specifications and ports"
license = "MIT"
readme = "../README.md"
documentation = "https://docs.rs/hiway-macros"
keywords = ["async", "event-bus", "no-std", "derive", "typed"]
categories = ["asynchronous", "no-std", "embedded"]

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[package.metadata.docs.rs]
all-features = true
