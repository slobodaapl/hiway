[package]
name = "hiway-uring"
version = "0.2.0"
edition = "2021"
rust-version = "1.96.1"
description = "Caller-driven io_uring transport for Hiway"
license = "MIT"
repository = "https://github.com/slobodaapl/hiway"

[dependencies]
hiway = { version = "=0.2.0", path = "..", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7.15", default-features = false }

[dev-dependencies]
stats_alloc = "0.1"

[[bench]]
name = "throughput"
harness = false
