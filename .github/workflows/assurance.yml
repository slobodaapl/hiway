name: Assurance

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.96.1
          --profile minimal
          --component clippy
          --component rustfmt
          --target thumbv7em-none-eabi

      - name: Install dependency policy checker
        run: cargo install cargo-deny --version 0.19.8 --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test supported feature sets
        run: |
          cargo test --workspace --locked
          cargo test --workspace --all-features --locked
          cargo test -p hiway --no-default-features --locked
          cargo test -p hiway --doc --locked
          cargo test -p hiway --no-default-features --doc --locked

      - name: Check no_std target
        run: cargo check -p hiway --no-default-features --target thumbv7em-none-eabi --locked

      - name: Lint supported feature sets
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -W clippy::pedantic
          cargo clippy -p hiway --no-default-features --all-targets --locked -- -D warnings -W clippy::pedantic

      - name: Model-check concurrency
        env:
          RUSTFLAGS: --cfg loom
        run: |
          cargo clippy -p hiway-loom --all-targets --locked -- -D warnings -W clippy::pedantic
          cargo test -p hiway-loom --locked

      - name: Check dependency policy
        run: cargo deny check

      - name: Check release package inputs
        run: |
          cargo package -p hiway-macros --locked
          cargo package -p hiway --list --locked

  release-evidence:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal

      - name: Build crates.io packages
        run: |
          cargo package -p hiway-macros --locked
          cargo package -p hiway --locked

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: target/package/hiway.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/package/*.crate

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: target/package/*.crate
          sbom-path: target/package/hiway.cdx.json

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            target/package/*.crate
            target/package/hiway.cdx.json
          if-no-files-found: error
          retention-days: 90
