[package]
name = "hiway"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
description = "An event bus with authority scopes, retention and backpressure control"
license = "MIT"
readme = "README.md"
repository = "https://github.com/slobodaapl/hiway"
documentation = "https://docs.rs/hiway"
exclude = [
    ".github/**",
    ".gitignore",
    "deny.toml",
    "docs/**",
    "rust-toolchain.toml",
    "SECURITY.md",
]
keywords = ["async", "event-bus", "no-std", "embedded", "typed"]
categories = ["asynchronous", "no-std", "embedded"]

[workspace]
members = ["hiway-macros", "hiway-loom", "hiway-tests"]
default-members = [".", "hiway-tests"]
resolver = "2"

[features]
default = []
std = ["dep:tokio", "dep:arc-swap"]
tokio-io = ["std", "tokio/net", "tokio/io-util", "tokio/rt"]

[dependencies]
atomic-waker = { version = "1.1", default-features = false }
arc-swap = { version = "1.9", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["sync", "macros"] }
spin = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex"] }
heapless = { version = "0.9", default-features = false }
hiway-macros = { version = "=0.1.0", path = "hiway-macros" }

[target.'cfg(loom)'.dependencies]
loom = { version = "0.7" }

[dev-dependencies]
stats_alloc = "0.1"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[[example]]
name = "basic"
required-features = ["std"]

[[example]]
name = "game"
required-features = ["std"]

[[example]]
name = "many_components"
required-features = ["std"]

[[example]]
name = "terminal"
required-features = ["std"]

[[example]]
name = "ipc"
required-features = ["tokio-io"]

[[example]]
name = "interference"
required-features = ["std"]

[[example]]
name = "ipc_interference"
required-features = ["tokio-io"]

[[example]]
name = "ipc_process"
required-features = ["tokio-io"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[profile.release]
opt-level = 3
panic = "abort"
strip = "symbols"
lto = "fat"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = true
incremental = false
rpath = false

[profile.release-symbols]
inherits = "release"
strip = "none"
debug = "full"
